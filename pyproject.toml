authors = [
    { name = "Bilal", email = "Bilalhijazi28@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "llama-index>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-groq>=0.6.1",
    "llama-index-storage-docstore-postgres==0.5.0",
    "llama-index-storage-kvstore-postgres>=0.4.3",
    "llama-index-vector-stores-postgres>=0.9.0",
    "llama-index-vector-stores-supabase>=0.6.0",
